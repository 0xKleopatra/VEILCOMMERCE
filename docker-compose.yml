# VeilCommerce — Proof Server + Local Midnight Node (Smart reuse: midnight-escrow standalone.yml + dmarket docker)
# For local `undeployed` development; preprod/preview use hosted proof server via 1AM ProofStation
version: "3.8"
services:
  proof-server:
    image: 'midnightntwrk/proof-server:7.0.0'
    container_name: veilcommerce-proof-server
    command: ['midnight-proof-server', '-v']
    ports:
      - '6300:6300'
    environment:
      RUST_BACKTRACE: 'full'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:6300/health']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Optional: full local stack (node + indexer) for `undeployed` network — mirrors midnight-escrow standalone
